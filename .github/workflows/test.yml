name: test

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --check scripts/track.mjs
      - run: node scripts/selftest.mjs
